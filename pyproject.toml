[project]
name = "doc-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4",
  "lightning>=2.2",
  "transformers>=4.40",
  "timm>=1.0",
  "datasets>=2.19",
  "torchmetrics>=1.3",
  "sentence-transformers>=2.7",
  "faiss-cpu>=1.8",
  "gymnasium>=0.29",
  "fastapi>=0.111",
  "gradio>=4.31",
  "wandb>=0.17",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "pydantic-settings>=2.2",
  "opencv-python-headless>=4.9",
  "easyocr>=1.7.2",
  "doclayout-yolo>=0.0.4",
  "huggingface-hub>=0.23",
]

[project.optional-dependencies]
dev = ["ruff>=0.4", "black>=24.4", "mypy>=1.10", "pytest>=8.2", "pre-commit>=3.7"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E","F","I","N","B","UP"]
[tool.black]
line-length = 100
[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
ignore_missing_imports = true
[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
testpaths = ["tests"]